name: fetch-media
on:
  push:
    branches: [fetchreq]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan fetched
          git rm -rfq --cached .
          git add media
          git commit -qm "fetched ${{ github.sha }}"
          git push -f origin fetched
